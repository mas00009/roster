<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Roster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --line:#E4E4E8; --line2:#C9C9D0;
  --ink:#111111; --dim:#5C5C66; --faint:#8E8E99;
  --acc:#00A3AD; --acc-soft:#D6F2F3; --acc-ink:#007A82;
  --chrome:#111111; --chrome-ink:#FFFFFF;
  --pm:#111111; --pm-ink:#FFFFFF;
  --pe:#00A3AD; --pe-ink:#FFFFFF;
  --am:#E8DFF7; --am-ink:#440099;
  --off:#EFEFF2; --off-ink:#7C7C88;
  --lv:#FBE3EE; --lv-ink:#9B1B5A;
  --ok:#1F9D63; --warn:#D98A0B; --bad:#D2483F;
  --radius:12px; --shadow:0 1px 2px rgba(17,17,17,.06),0 8px 24px -12px rgba(17,17,17,.18);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{font-size:15px;line-height:1.45;padding-bottom:max(24px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.05)}
button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
button.ghost:hover{background:var(--off)}
button.danger{color:var(--bad);border-color:#F1C6C2}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--chrome);color:var(--chrome-ink);border-bottom:3px solid var(--acc)}
header .sub{color:#A9A9B3}
header .tabs{background:rgba(255,255,255,.1)}
header .tabs button{color:#C9C9D0}
header .tabs button.on{background:#fff;color:var(--ink)}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
header button:hover{border-color:var(--acc)}
header .pill{background:rgba(255,255,255,.12);color:#E4E4E8}
header .pill.mgr{background:var(--acc);color:#fff}
.brandmark{width:34px;height:34px;border-radius:9px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;margin-right:12px;flex:none}
.brandmark svg{width:20px;height:20px}
.brandline{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.bar h1{font-size:19px;line-height:1.15}
.bar .sub{font-size:12px}
.spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--off);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--dim);font-weight:600}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lock{display:flex;align-items:center;gap:8px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--off);color:var(--dim)}
.pill.mgr{background:var(--acc-soft);color:var(--acc)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
main{padding-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .hd h2{font-size:16px}
.card .bd{padding:16px}
.nav{display:flex;align-items:center;gap:6px}
.nav .range{font-weight:600;min-width:170px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:13px;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--acc);color:#fff}

/* grid */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.grid th{font-size:12px;font-weight:600;color:var(--dim);padding:10px 6px;background:#FAFBFC;position:sticky;top:0;white-space:nowrap}
.grid th.name,.grid td.name{position:sticky;left:0;background:#fff;text-align:left;padding:8px 14px;min-width:132px;z-index:2;border-right:1px solid var(--line);font-weight:600}
.grid th.name{background:#FAFBFC;z-index:3}
.grid th .d{display:block;font-size:17px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.grid th.today .d{color:var(--acc-ink)}
.grid th.today{box-shadow:inset 0 -3px 0 var(--acc)}
.grid th.we{color:var(--faint)}
.grid td.cell{min-width:78px;height:56px;padding:5px 4px;position:relative}
.grid td.cell.we{background:#FBFCFD}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:44px;border-radius:9px;font-weight:700;font-size:13px;line-height:1.1;user-select:none;border:1.5px solid transparent;position:relative}
.chip small{font-weight:500;font-size:10px;opacity:.85;margin-top:2px}
.chip.PM{background:var(--pm);color:var(--pm-ink)}
.chip.PE{background:var(--pe);color:var(--pe-ink)}
.chip.AM{background:var(--am);color:var(--am-ink)}
.chip.OFF{background:var(--off);color:var(--off-ink)}
.chip.LV{background:var(--lv);color:var(--lv-ink);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(91,58,138,.08) 6px 8px)}
.chip.empty{border:1.5px dashed var(--line2);color:transparent}
.mgr .chip{cursor:pointer}
.mgr .chip:hover{filter:brightness(.97);border-color:var(--acc)}
.mgr .chip.empty:hover{color:var(--faint)}
.chip .flag{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
td.cov{padding:6px 4px}
.covc{border-radius:8px;font-size:11px;font-weight:700;padding:6px 4px;line-height:1.15}
.covc.full{background:#DFF5EA;color:#146B43}
.covc.part{background:#FCEBCB;color:#7A4E00}
.covc.none{background:#FBE1DE;color:#8E2A22}
.grid tr.covrow td{border-top:2px solid var(--line2);background:#FAFBFC}
.grid td.hrs{font-size:12px;color:var(--dim);min-width:60px;padding:0 8px;white-space:nowrap}
.grid th.hrs{min-width:60px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);padding:12px 16px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:14px;height:14px;border-radius:4px;display:inline-block}

/* popover */
.pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px -8px rgba(20,32,43,.35);padding:8px;display:grid;gap:4px;min-width:190px}
.pop button{display:flex;align-items:center;gap:10px;border:0;text-align:left;padding:9px 10px;border-radius:8px}
.pop button:hover{background:var(--off)}
.pop button b{width:34px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.pop .who{font-size:12px;color:var(--faint);padding:4px 10px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}

/* warnings */
.warns{display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#FFF5F4;border:1px solid #F5D3D0;font-size:14px}
.warn.amber{background:#FFF8EA;border-color:#F3DFB4}
.warn .k{font-weight:700;white-space:nowrap}
.allgood{color:var(--ok);font-weight:600;display:flex;align-items:center;gap:8px}

/* leave */
.lv-list{display:grid;gap:8px}
.lv{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.lv .who{font-weight:700}
.lv .when{color:var(--dim);font-size:14px}
.lv .note{color:var(--faint);font-size:13px;flex-basis:100%}
.lv .st{margin-left:auto;display:flex;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.tag.pending{background:#FCEBCB;color:#7A4E00}
.tag.approved{background:#DFF5EA;color:#146B43}
.tag.declined{background:var(--off);color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}.bar h1{font-size:18px}.nav .range{min-width:0;font-size:14px}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--dim);font-size:13px}
.staffrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.staffrow input{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{background:var(--off);border-radius:10px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--dim)}
#setup{max-width:520px;margin:40px auto}
.modal{position:fixed;inset:0;background:rgba(20,32,43,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .card{width:100%;max-width:380px}
.hidden{display:none!important}
.avatar{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;align-items:center;justify-content:center;margin-right:8px;flex:none}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div style="display:flex;align-items:center"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 14c0-5 4-8 9-8s7 3 7 6-2 5-5 5-4-2-4-4 1.5-3 3.5-3"/></svg></span><div><div class="brandline">Air New Zealand</div><h1 id="teamName">Roster</h1><div class="sub" id="sub">Loading…</div></div></div>
  <div class="spacer"></div>
  <div class="tabs" id="tabs">
    <button data-tab="roster" class="on">Roster</button>
    <button data-tab="leave">Leave <span id="leaveBadge"></span></button>
    <button data-tab="team">Team</button>
    <button data-tab="feedback">Feedback</button>
  </div>
  <div class="lock" id="lock"></div>
</div></header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ===================== config ===================== */
var EXEC = "https://script.google.com/macros/s/AKfycbxwzBWM6CodJqxwuUXnrs4X879Dpj1uo9jqFdLYV1mXZ4I0570c6NP4KBnNhiwjT9Ro/exec";
var MOCK = /[?&]mock/.test(location.search) || EXEC.indexOf('http') !== 0;

/* ===================== api ===================== */
function api(fn) {
  var args = [].slice.call(arguments, 1);
  if (MOCK) return mockApi(fn, args);
  return fetch(EXEC + '?api=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args)))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) return d.result; throw new Error(d.error || 'Server error'); });
}

/* ===================== state ===================== */
var S = { meta: null, shifts: {}, leave: [], feedback: [], pin: null, tab: 'roster', start: mondayOf(todayIso()), days: 7 };
try { S.pin = localStorage.getItem('ros:pin'); S.days = +localStorage.getItem('ros:days') || 7; } catch (e) {}
var CODE = {
  PM: { label: 'PM', hint: function () { return fmtRange(S.meta.settings.pm); }, hours: function () { return hrs(S.meta.settings.pm); } },
  PE: { label: 'PM', hint: function () { return fmtRange(S.meta.settings.pe); }, hours: function () { return hrs(S.meta.settings.pe); } },
  AM: { label: 'AM', hint: function () { return fmtRange(S.meta.settings.am); }, hours: function () { return hrs(S.meta.settings.am); } },
  OFF: { label: 'Off', hint: function () { return ''; }, hours: function () { return 0; } },
  LV: { label: 'Leave', hint: function () { return ''; }, hours: function () { return 0; } }
};

/* ===================== dates ===================== */
function todayIso() { var d = new Date(); return [d.getFullYear(), p2(d.getMonth() + 1), p2(d.getDate())].join('-'); }
function p2(n) { return (n < 10 ? '0' : '') + n; }
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dow(iso) { return new Date(iso + 'T00:00:00Z').getUTCDay(); } // 0 Sun
function mondayOf(iso) { var w = dow(iso); return addDays(iso, w === 0 ? -6 : 1 - w); }
var DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtD(iso) { return DN[dow(iso)] + ' ' + (+iso.slice(8)) + ' ' + MN[+iso.slice(5, 7) - 1]; }
function fmtShort(iso) { return (+iso.slice(8)) + ' ' + MN[+iso.slice(5, 7) - 1]; }
function fmtT(t) { var h = +t.slice(0, 2), m = t.slice(3); return (h % 12 || 12) + (m !== '00' ? ':' + m : '') + (h < 12 ? 'am' : 'pm'); }
function fmtRange(r) { return fmtT(r[0]) + '–' + fmtT(r[1]); }
function hrs(r) { var a = r[0].split(':'), b = r[1].split(':'); var h = (+b[0] + b[1] / 60) - (+a[0] + a[1] / 60); return h < 0 ? h + 24 : h; }
function rangeDays() { var out = []; for (var i = 0; i < S.days; i++) out.push(addDays(S.start, i)); return out; }
function monthsFor(from, to) { var out = {}, d = from; while (d <= to) { out[d.slice(0, 7)] = 1; d = addDays(d, 1); } out[to.slice(0, 7)] = 1; return Object.keys(out); }

/* ===================== lookups ===================== */
function staffById(id) { return (S.meta.staff || []).filter(function (s) { return s.id === id; })[0]; }
function onLeave(iso, sid) {
  return S.leave.some(function (l) { return l.staffId === sid && l.status === 'approved' && l.from <= iso && l.to >= iso; });
}
function rawCode(iso, sid) { var m = S.shifts[iso.slice(0, 7)]; return (m && m[iso] && m[iso][sid]) || ''; }
function code(iso, sid) { return onLeave(iso, sid) ? 'LV' : rawCode(iso, sid); }
function works(c) { return c === 'AM' || c === 'PM' || c === 'PE'; }

/* ===================== rules ===================== */
function analyse(days) {
  var issues = {}, list = [], cov = {};
  function add(iso, sid, msg, cls) {
    (issues[iso] = issues[iso] || {})[sid] = ((issues[iso] || {})[sid] || []).concat([msg]);
    list.push({ iso: iso, sid: sid, msg: msg, cls: cls || 'red' });
  }
  var first = days[0], last = days[days.length - 1];
  S.meta.staff.forEach(function (s) {
    var run = 0, d = addDays(first, -7);
    while (d <= last) {
      var c = code(d, s.id);
      run = works(c) ? run + 1 : 0;
      if (d >= first) {
        if (run >= 7) add(d, s.id, 'Day ' + run + ' in a row (max 6)');
        var prev = code(addDays(d, -1), s.id);
        if (c === 'AM' && (prev === 'PM' || prev === 'PE')) add(d, s.id, 'AM straight after a PM (needs a day off between)');
      }
      d = addDays(d, 1);
    }
  });
  days.forEach(function (iso) {
    var full = false, part = false;
    S.meta.staff.forEach(function (s) { var c = code(iso, s.id); if (c === 'PM') full = true; if (c === 'PE') part = true; });
    cov[iso] = full ? 'full' : part ? 'part' : 'none';
    if (cov[iso] === 'none') list.push({ iso: iso, msg: 'No evening cover', cls: 'red' });
    else if (cov[iso] === 'part') list.push({ iso: iso, msg: 'Cover finishes 8pm, not 10pm', cls: 'amber' });
  });
  return { issues: issues, list: list, cov: cov };
}

/* Fill empty evenings across the visible range so every day has a PM (till 10pm),
   choosing the person with the fewest evenings so far who can take it without
   breaking either rule. Never overwrites a shift someone already has. */
function autofill(days) {
  var changes = [], local = JSON.parse(JSON.stringify(S.shifts));
  function get(iso, sid) { if (onLeave(iso, sid)) return 'LV'; var m = local[iso.slice(0, 7)]; return (m && m[iso] && m[iso][sid]) || ''; }
  function set(iso, sid, c) { var mo = iso.slice(0, 7); local[mo] = local[mo] || {}; local[mo][iso] = local[mo][iso] || {}; local[mo][iso][sid] = c; changes.push({ date: iso, staffId: sid, code: c }); }
  function runBefore(iso, sid) { var n = 0, d = addDays(iso, -1); while (works(get(d, sid)) && n < 14) { n++; d = addDays(d, -1); } return n; }
  function runAfter(iso, sid) { var n = 0, d = addDays(iso, 1); while (works(get(d, sid)) && n < 14) { n++; d = addDays(d, 1); } return n; }
  var count = {};
  S.meta.staff.forEach(function (s) { count[s.id] = 0; days.forEach(function (d) { var c = get(d, s.id); if (c === 'PM' || c === 'PE') count[s.id]++; }); });
  days.forEach(function (iso) {
    var covered = S.meta.staff.some(function (s) { return get(iso, s.id) === 'PM'; });
    if (covered) return;
    var partial = S.meta.staff.filter(function (s) { return get(iso, s.id) === 'PE'; })[0];
    if (partial) { set(iso, partial.id, 'PM'); return; } // stretch the 8pm finish to 10pm
    var cands = S.meta.staff.filter(function (s) {
      if (get(iso, s.id)) return false;
      if (runBefore(iso, s.id) + 1 + runAfter(iso, s.id) > 6) return false;
      if (get(addDays(iso, 1), s.id) === 'AM') return false;
      return true;
    });
    if (!cands.length) return;
    cands.sort(function (a, b) { return count[a.id] - count[b.id] || runBefore(iso, a.id) - runBefore(iso, b.id); });
    set(iso, cands[0].id, 'PM'); count[cands[0].id]++;
  });
  return changes;
}

/* ===================== render ===================== */
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function initials(n) { return n.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2400); }

function render() {
  var app = $('#app');
  if (!S.meta) return;
  document.body.classList.toggle('mgr', !!S.pin);
  $('#teamName').textContent = S.meta.settings.team || 'Roster';
  $('#lock').innerHTML = S.pin
    ? '<span class="pill mgr"><i></i>Manager</span><button class="ghost" onclick="lockOut()">Lock</button>'
    : '<span class="pill"><i></i>Viewing</span><button onclick="askPin()">Manager sign in</button>';
  var pend = S.leave.filter(function (l) { return l.status === 'pending'; }).length;
  $('#leaveBadge').textContent = pend ? '(' + pend + ')' : '';
  if (!S.meta.ready) { renderSetup(app); return; }
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
  if (S.tab === 'roster') renderRoster(app);
  else if (S.tab === 'leave') renderLeave(app);
  else if (S.tab === 'feedback') renderFeedback(app);
  else renderTeam(app);
}

function renderSetup(app) {
  $('#sub').textContent = 'First time here';
  $('#tabs').classList.add('hidden'); $('#lock').classList.add('hidden');
  app.innerHTML = '<div class="card" id="setup"><div class="hd"><h2>Set up the roster</h2></div><div class="bd">' +
    '<p class="muted" style="margin-top:0">Name the team, add the people, and choose a manager PIN. The PIN is what lets someone change the roster and approve leave. Anyone with the link can view it and request leave.</p>' +
    '<label>Team name</label><input id="suTeam" placeholder="e.g. Evening crew" value="Roster">' +
    '<label>People</label><div id="suNames">' + [1, 2, 3, 4].map(function (i) { return '<input style="margin-bottom:6px" placeholder="Person ' + i + '">'; }).join('') + '</div>' +
